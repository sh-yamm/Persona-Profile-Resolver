<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1000" height="1010" rx="14" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Data flow for one persona</text>
  <text x="500" y="54" text-anchor="middle" font-size="12" fill="#475569">left: the data object at each step · right: what produces it and where the data comes from</text>

  <g font-size="11.5">
    <!-- 1 -->
    <rect x="30" y="74" width="470" height="88" rx="10" fill="#fef3c7" stroke="#d97706"/>
    <text x="46" y="96" font-weight="700" font-size="13" fill="#78350f">Raw persona</text>
    <text x="46" y="116" fill="#57534e" font-family="Consolas, Menlo, monospace" font-size="11">{"name": "Jane Doe (Acme)", "image": "drive…", "intro": "Head of Ops</text>
    <text x="46" y="132" fill="#57534e" font-family="Consolas, Menlo, monospace" font-size="11"> @ Acme (https://acme.io) - Austin, TX", "timezone": "America/Chicago",</text>
    <text x="46" y="148" fill="#57534e" font-family="Consolas, Menlo, monospace" font-size="11"> "company_size": "11-50", "social_profile": ["twitter.com/jdoe"]}</text>
    <text x="530" y="102" font-weight="700" fill="#0f172a">input file (list of personas)</text>
    <text x="530" y="120" fill="#475569">Type 1: full name + intro + timezone + photo</text>
    <text x="530" y="136" fill="#475569">Type 2: first name (+ initial) + industry + size</text>

    <!-- 2 -->
    <rect x="30" y="182" width="470" height="104" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="46" y="204" font-weight="700" font-size="13" fill="#0c4a6e">Normalised Persona</text>
    <text x="46" y="224" fill="#334155">first/last/initial · name hint ("Acme") · companies (strong / weak)</text>
    <text x="46" y="240" fill="#334155">titles · domains · rare intro words · city · stated country</text>
    <text x="46" y="256" fill="#334155">timezone → country / region prior · size range · industry</text>
    <text x="46" y="272" fill="#334155">twitter / bluesky / github handles</text>
    <text x="530" y="210" font-weight="700" fill="#0f172a">persona.build()  ·  textutil.py</text>
    <text x="530" y="228" fill="#475569">regex + heuristics ("@ X", "at X", "X (url)", "in UK", "City, ST")</text>
    <text x="530" y="244" fill="#475569">"Tools:" / "Looking for:" asides ignored</text>
    <text x="530" y="260" fill="#475569">optional Mistral (free tier) for messy intros</text>

    <!-- 3 -->
    <rect x="30" y="306" width="470" height="104" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="46" y="328" font-weight="700" font-size="13" fill="#0c4a6e">Enriched Persona  +  extras</text>
    <text x="46" y="348" fill="#334155">+ site name as company · LinkedIn company pages of the site</text>
    <text x="46" y="364" fill="#334155">+ titles / location from sentences that mention the person</text>
    <text x="46" y="380" fill="#334155">+ facts from X / Bluesky / GitHub bios (cleaned)</text>
    <text x="46" y="396" fill="#334155">+ direct linkedin.com/in links found on those pages</text>
    <text x="530" y="334" font-weight="700" fill="#0f172a">sources.persona_links()  ·  persona.enrich()</text>
    <text x="530" y="352" fill="#475569">homepage + 2 about/team pages, parent-domain fallback</text>
    <text x="530" y="368" fill="#475569">Bluesky &amp; GitHub public APIs; X bio from search snippet</text>
    <text x="530" y="384" fill="#475569">@company_hq handles → company names; own handle dropped</text>

    <!-- 4 -->
    <rect x="30" y="430" width="470" height="88" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="46" y="452" font-weight="700" font-size="13" fill="#4c1d95">Query ladder (≤ 7 queries)</text>
    <text x="46" y="472" fill="#334155" font-family="Consolas, Menlo, monospace" font-size="11">"Jane Doe" "Acme" site:linkedin.com/in      (tight)</text>
    <text x="46" y="488" fill="#334155" font-family="Consolas, Menlo, monospace" font-size="11">"Jane Doe" Head of Ops site:linkedin.com/in (tight)</text>
    <text x="46" y="504" fill="#334155" font-family="Consolas, Menlo, monospace" font-size="11">Jane Doe Acme linkedin · "Jane Doe" acme.io … (loose)</text>
    <text x="530" y="458" font-weight="700" fill="#0f172a">pipeline.build_queries()</text>
    <text x="530" y="476" fill="#475569">specific → loose; city, rare words, handles when useful</text>
    <text x="530" y="492" fill="#475569">Type 2: first name + role + industry + country</text>
    <text x="530" y="508" fill="#475569">stops early once a strong full-name candidate appears</text>

    <!-- 5 -->
    <rect x="30" y="538" width="470" height="104" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="46" y="560" font-weight="700" font-size="13" fill="#4c1d95">Candidate pool</text>
    <text x="46" y="580" fill="#334155">canonical /in/&lt;slug&gt; URL (junk slugs rejected)</text>
    <text x="46" y="596" fill="#334155">parsed snippets: name, headline, company, location</text>
    <text x="46" y="612" fill="#334155">sources (persona link / tight / loose / slug) · best rank</text>
    <text x="46" y="628" fill="#334155">post URLs (a post reveals its author's slug)</text>
    <text x="530" y="566" font-weight="700" fill="#0f172a">search.Searcher  ·  search.parse_snippet()</text>
    <text x="530" y="584" fill="#475569">ddgs backends rotated: Bing, Yahoo, DDG, Brave, Mojeek</text>
    <text x="530" y="600" fill="#475569">splice-safe: Bing sometimes glues 2 results together</text>
    <text x="530" y="616" fill="#475569">snippet pre-rank → only top-3 get LinkedIn requests</text>

    <!-- 6 -->
    <rect x="30" y="662" width="470" height="104" rx="10" fill="#e0e7ff" stroke="#0a66c2"/>
    <text x="46" y="684" font-weight="700" font-size="13" fill="#0a66c2">Candidate evidence</text>
    <text x="46" y="704" fill="#334155">Profile: name, location, country, companies, company site,</text>
    <text x="46" y="720" fill="#334155">        school, posts, photo   (or a partial Profile from posts)</text>
    <text x="46" y="736" fill="#334155">company facts: industry, size bucket, website, HQ</text>
    <text x="46" y="752" fill="#334155">face_sim: cosine(persona photo, candidate photo)</text>
    <text x="530" y="690" font-weight="700" fill="#0f172a">LinkedInClient · GuestBrowser · FaceMatcher</text>
    <text x="530" y="708" fill="#475569">profile: JSON-LD Person + og: tags (anonymous Chrome)</text>
    <text x="530" y="724" fill="#475569">posts: JSON-LD author {name, url, image}, followers</text>
    <text x="530" y="740" fill="#475569">company: about-us__industry / __size / __website</text>
    <text x="530" y="756" fill="#475569">face sweep: up to 6 namesakes, stop when decided</text>

    <!-- 7 -->
    <rect x="30" y="786" width="470" height="88" rx="10" fill="#fce7f3" stroke="#db2777"/>
    <text x="46" y="808" font-weight="700" font-size="13" fill="#831843">Feature levels per (persona, candidate)</text>
    <text x="46" y="828" fill="#334155">name=full · company=strong · domain=match · title=weak</text>
    <text x="46" y="844" fill="#334155">location=country_tz · face=strong · size=match · industry=…</text>
    <text x="46" y="860" fill="#334155">missing data on either side → None (never a mismatch)</text>
    <text x="530" y="812" font-weight="700" fill="#0f172a">features.extract()</text>
    <text x="530" y="830" fill="#475569">12 comparators, each returns a discrete level</text>
    <text x="530" y="846" fill="#475569">Jaro-Winkler, fuzzy company, prefix match, synonyms,</text>
    <text x="530" y="862" fill="#475569">seniority, abbreviations (RevOps → revenue operations)</text>

    <!-- 8 -->
    <rect x="30" y="894" width="470" height="96" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="46" y="916" font-weight="700" font-size="13" fill="#14532d">Result</text>
    <text x="46" y="936" fill="#14532d">linkedin_url · confidence 0.98 · CI [0.82, 1.00]</text>
    <text x="46" y="952" fill="#14532d">status: matched / ambiguous / low_confidence / not_found</text>
    <text x="46" y="968" fill="#14532d">fields_validated 5/6 · evidence per field · alternatives</text>
    <text x="530" y="920" font-weight="700" fill="#0f172a">scorer.py  ·  run.py</text>
    <text x="530" y="938" fill="#475569">Σ weights + prior − namesake penalty → Platt → p</text>
    <text x="530" y="954" fill="#475569">CI = weight noise × bootstrap calibration (5th–95th pct)</text>
    <text x="530" y="970" fill="#475569">written incrementally → results.json + results.csv</text>
  </g>
  <g stroke="#334155" stroke-width="1.6" marker-end="url(#a)">
    <line x1="265" y1="162" x2="265" y2="180"/>
    <line x1="265" y1="286" x2="265" y2="304"/>
    <line x1="265" y1="410" x2="265" y2="428"/>
    <line x1="265" y1="518" x2="265" y2="536"/>
    <line x1="265" y1="642" x2="265" y2="660"/>
    <line x1="265" y1="766" x2="265" y2="784"/>
    <line x1="265" y1="874" x2="265" y2="892"/>
  </g>
  <line x1="515" y1="74" x2="515" y2="990" stroke="#e2e8f0" stroke-width="1.5"/>
</svg>
