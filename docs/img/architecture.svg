<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="660" viewBox="0 0 1040 660" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1040" height="660" rx="14" fill="#ffffff"/>
  <text x="520" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">System architecture</text>
  <text x="520" y="54" text-anchor="middle" font-size="12" fill="#475569">one staged pipeline, identical for every persona · every external call is anonymous, rate-limited and cached</text>

  <!-- external sources -->
  <rect x="20" y="72" width="1000" height="112" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="34" y="92" font-size="12" font-weight="700" fill="#334155">EXTERNAL SOURCES (no login, no cookies from any account)</text>
  <g font-size="11.5" fill="#0f172a">
    <rect x="34" y="102" width="180" height="70" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="124" y="122" text-anchor="middle" font-weight="700">Persona's own websites</text>
    <text x="124" y="140" text-anchor="middle" fill="#475569">homepage + about / team pages</text>
    <text x="124" y="156" text-anchor="middle" fill="#475569">parent domain if subdomain dead</text>

    <rect x="226" y="102" width="180" height="70" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="316" y="122" text-anchor="middle" font-weight="700">Social bios</text>
    <text x="316" y="140" text-anchor="middle" fill="#475569">Bluesky API · GitHub API</text>
    <text x="316" y="156" text-anchor="middle" fill="#475569">X bio via search snippet</text>

    <rect x="418" y="102" width="200" height="70" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="518" y="122" text-anchor="middle" font-weight="700">Search engines (ddgs)</text>
    <text x="518" y="140" text-anchor="middle" fill="#475569">Bing · Yahoo · DDG · Brave · Mojeek</text>
    <text x="518" y="156" text-anchor="middle" fill="#475569">rotated, keyless, cached</text>

    <rect x="630" y="102" width="210" height="70" rx="8" fill="#ffffff" stroke="#0a66c2" stroke-width="1.5"/>
    <text x="735" y="122" text-anchor="middle" font-weight="700" fill="#0a66c2">LinkedIn guest pages</text>
    <text x="735" y="140" text-anchor="middle" fill="#475569">/in/ profile · /posts/ · /company/</text>
    <text x="735" y="156" text-anchor="middle" fill="#475569">what logged-out visitors see</text>

    <rect x="852" y="102" width="156" height="70" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="930" y="122" text-anchor="middle" font-weight="700">Photos</text>
    <text x="930" y="140" text-anchor="middle" fill="#475569">Google Drive (persona)</text>
    <text x="930" y="156" text-anchor="middle" fill="#475569">media.licdn.com (candidate)</text>
  </g>

  <!-- pipeline -->
  <text x="34" y="214" font-size="12" font-weight="700" fill="#334155">PIPELINE (enrich/pipeline.py · Resolver.resolve)</text>
  <g font-size="11" fill="#0f172a">
    <!-- input -->
    <rect x="20" y="226" width="118" height="168" rx="10" fill="#fef3c7" stroke="#d97706"/>
    <text x="79" y="248" text-anchor="middle" font-weight="700" font-size="12">Persona JSON</text>
    <text x="79" y="270" text-anchor="middle" fill="#57534e">name</text>
    <text x="79" y="286" text-anchor="middle" fill="#57534e">image</text>
    <text x="79" y="302" text-anchor="middle" fill="#57534e">intro</text>
    <text x="79" y="318" text-anchor="middle" fill="#57534e">timezone</text>
    <text x="79" y="334" text-anchor="middle" fill="#57534e">company_industry</text>
    <text x="79" y="350" text-anchor="middle" fill="#57534e">company_size</text>
    <text x="79" y="366" text-anchor="middle" fill="#57534e">social_profile</text>

    <rect x="152" y="226" width="134" height="168" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="219" y="248" text-anchor="middle" font-weight="700" font-size="12">① Enrich</text>
    <text x="219" y="268" text-anchor="middle">persona.py · sources.py</text>
    <text x="160" y="292" fill="#334155">• name / intro parsing</text>
    <text x="160" y="308" fill="#334155">• timezone → country</text>
    <text x="160" y="324" fill="#334155">• read linked sites</text>
    <text x="160" y="340" fill="#334155">• mine social bios</text>
    <text x="160" y="356" fill="#334155">• fold facts back</text>
    <text x="160" y="372" fill="#334155">• (optional) Mistral</text>

    <rect x="300" y="226" width="134" height="168" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="367" y="248" text-anchor="middle" font-weight="700" font-size="12">② Candidates</text>
    <text x="367" y="268" text-anchor="middle">search.py · pipeline.py</text>
    <text x="308" y="292" fill="#334155">• persona-published</text>
    <text x="316" y="306" fill="#334155">linkedin links</text>
    <text x="308" y="322" fill="#334155">• query ladder</text>
    <text x="308" y="338" fill="#334155">• post authors</text>
    <text x="308" y="354" fill="#334155">• slug guesses</text>
    <text x="308" y="370" fill="#334155">• snippet pre-rank</text>

    <rect x="448" y="226" width="134" height="168" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="515" y="248" text-anchor="middle" font-weight="700" font-size="12">③ Evidence</text>
    <text x="515" y="268" text-anchor="middle">linkedin.py · browser.py</text>
    <text x="456" y="292" fill="#334155">top-3 candidates:</text>
    <text x="456" y="308" fill="#334155">• profile page</text>
    <text x="456" y="324" fill="#334155">• else post pages</text>
    <text x="464" y="338" fill="#334155">(name, photo, text)</text>
    <text x="456" y="354" fill="#334155">• company page</text>
    <text x="464" y="368" fill="#334155">(industry, size, site)</text>

    <rect x="596" y="226" width="134" height="168" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="663" y="248" text-anchor="middle" font-weight="700" font-size="12">④ Face sweep</text>
    <text x="663" y="268" text-anchor="middle">face.py</text>
    <text x="604" y="292" fill="#334155">• YuNet detect</text>
    <text x="604" y="308" fill="#334155">• SFace embed</text>
    <text x="604" y="324" fill="#334155">• ≤ 6 namesakes</text>
    <text x="604" y="340" fill="#334155">• cosine ≥ 0.363</text>
    <text x="612" y="354" fill="#334155">= same identity</text>
    <text x="604" y="370" fill="#334155">• stop when decided</text>

    <rect x="744" y="226" width="134" height="168" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="811" y="248" text-anchor="middle" font-weight="700" font-size="12">⑤ Score</text>
    <text x="811" y="268" text-anchor="middle">features.py · scorer.py</text>
    <text x="752" y="292" fill="#334155">• 12 field comparators</text>
    <text x="752" y="308" fill="#334155">• Fellegi–Sunter</text>
    <text x="760" y="322" fill="#334155">log-odds weights</text>
    <text x="752" y="338" fill="#334155">• namesake penalty</text>
    <text x="752" y="354" fill="#334155">• Platt calibration</text>
    <text x="752" y="370" fill="#334155">• bootstrap 90% CI</text>

    <rect x="892" y="226" width="128" height="168" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="956" y="248" text-anchor="middle" font-weight="700" font-size="12">Output</text>
    <text x="956" y="270" text-anchor="middle" fill="#14532d">results.json</text>
    <text x="956" y="286" text-anchor="middle" fill="#14532d">results.csv</text>
    <text x="900" y="310" fill="#14532d">• linkedin_url</text>
    <text x="900" y="326" fill="#14532d">• confidence + CI</text>
    <text x="900" y="342" fill="#14532d">• fields_validated</text>
    <text x="900" y="358" fill="#14532d">• per-field evidence</text>
    <text x="900" y="374" fill="#14532d">• alternatives</text>
  </g>
  <g stroke="#334155" stroke-width="1.6" marker-end="url(#arr)">
    <line x1="138" y1="310" x2="150" y2="310"/>
    <line x1="286" y1="310" x2="298" y2="310"/>
    <line x1="434" y1="310" x2="446" y2="310"/>
    <line x1="582" y1="310" x2="594" y2="310"/>
    <line x1="730" y1="310" x2="742" y2="310"/>
    <line x1="878" y1="310" x2="890" y2="310"/>
  </g>
  <!-- calls to sources -->
  <g stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrg)" fill="none">
    <line x1="200" y1="226" x2="140" y2="174"/>
    <line x1="240" y1="226" x2="300" y2="174"/>
    <line x1="367" y1="226" x2="500" y2="174"/>
    <line x1="515" y1="226" x2="700" y2="174"/>
    <line x1="663" y1="226" x2="900" y2="174"/>
  </g>

  <!-- infra -->
  <text x="34" y="432" font-size="12" font-weight="700" fill="#334155">INFRASTRUCTURE (shared by every stage)</text>
  <g font-size="11.5" fill="#0f172a">
    <rect x="20" y="444" width="190" height="118" rx="10" fill="#f8fafc" stroke="#64748b"/>
    <text x="115" y="466" text-anchor="middle" font-weight="700">Fetcher · net.py</text>
    <text x="30" y="488" fill="#475569">curl_cffi, real Chrome</text>
    <text x="30" y="504" fill="#475569">TLS / HTTP2 fingerprint</text>
    <text x="30" y="520" fill="#475569">999 / authwall detection</text>
    <text x="30" y="536" fill="#475569">guest session reset on block</text>

    <rect x="222" y="444" width="190" height="118" rx="10" fill="#f8fafc" stroke="#64748b"/>
    <text x="317" y="466" text-anchor="middle" font-weight="700">GuestBrowser · browser.py</text>
    <text x="232" y="488" fill="#475569">Patchright on real Chrome</text>
    <text x="232" y="504" fill="#475569">one window, own thread</text>
    <text x="232" y="520" fill="#475569">modal close + small scroll</text>
    <text x="232" y="536" fill="#475569">authwall reported, not bypassed</text>

    <rect x="424" y="444" width="190" height="118" rx="10" fill="#f8fafc" stroke="#64748b"/>
    <text x="519" y="466" text-anchor="middle" font-weight="700">RateLimiter · net.py</text>
    <text x="434" y="488" fill="#475569">per-host jittered gaps</text>
    <text x="434" y="504" fill="#475569">cool-down 2 → 30 min, doubling</text>
    <text x="434" y="520" fill="#475569">non-blocking for LinkedIn</text>
    <text x="434" y="536" fill="#475569">state persisted across runs</text>

    <rect x="626" y="444" width="190" height="118" rx="10" fill="#f8fafc" stroke="#64748b"/>
    <text x="721" y="466" text-anchor="middle" font-weight="700">Cache · cache.py</text>
    <text x="636" y="488" fill="#475569">SQLite key/value</text>
    <text x="636" y="504" fill="#475569">search · html · profiles · posts</text>
    <text x="636" y="520" fill="#475569">companies · faces · images</text>
    <text x="636" y="536" fill="#475569">resumable · --offline re-score</text>

    <rect x="828" y="444" width="192" height="118" rx="10" fill="#f8fafc" stroke="#64748b"/>
    <text x="924" y="466" text-anchor="middle" font-weight="700">Calibration · calibrate.py</text>
    <text x="838" y="488" fill="#475569">hand-verified labels</text>
    <text x="838" y="504" fill="#475569">Platt fit on FS scores</text>
    <text x="838" y="520" fill="#475569">200 bootstrap refits → CI</text>
    <text x="838" y="536" fill="#475569">accuracy report</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" fill="none">
    <line x1="219" y1="394" x2="219" y2="444"/>
    <line x1="515" y1="394" x2="515" y2="444"/>
    <line x1="811" y1="394" x2="900" y2="444"/>
  </g>

  <rect x="20" y="584" width="1000" height="56" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="520" y="606" text-anchor="middle" font-size="12" fill="#7c2d12" font-weight="700">Guard-rails</text>
  <text x="520" y="626" text-anchor="middle" font-size="11.5" fill="#7c2d12">never logs in · never uses account cookies · never bypasses an authwall · single-instance run lock · everything cached so LinkedIn is asked as rarely as possible</text>
</svg>
